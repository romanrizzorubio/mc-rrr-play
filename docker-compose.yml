version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mc-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mc-network

  mc-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/mc-frontend:/app/packages/mc-frontend
      - ./node_modules:/app/node_modules
    command: npm run serve --workspace=packages/mc-frontend -- --host 0.0.0.0 --port 8000
    networks:
      - mc-network

  mc-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=mc
    volumes:
      - ./packages/mc-back:/app/packages/mc-back
      - ./packages/mc-endpoints:/app/packages/mc-endpoints
      - ./packages/mc-data:/app/packages/mc-data
      - ./packages/mc-shared:/app/packages/mc-shared
      - ./node_modules:/app/node_modules
    command: npm run start:backend
    networks:
      - mc-network
    depends_on:
      mc-frontend:
        condition: service_started
      mongodb:
        condition: service_healthy

networks:
  mc-network:
    driver: bridge

volumes:
  mc-mongodb-data:
