version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mc-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mc-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - mc-network

  mc-user-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
      - SESSION_COOKIE_SECURE=true
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=mc
      - FRONTEND_ORIGIN=https://51.20.138.135
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - 'SMTP_FROM=${SMTP_FROM:-MC RRR Play <noreply@localhost>}'
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/back/mc-user-service:/app/packages/back/mc-user-service
      # - ./packages/core/mc-endpoints:/app/packages/core/mc-endpoints
      # - ./node_modules:/app/node_modules
    command: npm run start:mc-user-service
    networks:
      - mc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:3003/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started

  mc-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "443:8000"
    environment:
      - NODE_ENV=development
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/front/mc-frontend:/app/packages/front/mc-frontend
      # - ./packages/front/mc-components:/app/packages/front/mc-components
      # - ./packages/core/mc-endpoints:/app/packages/core/mc-endpoints
      # - ./node_modules:/app/node_modules
    command: npm run serve --workspace=packages/front/mc-frontend -- --host 0.0.0.0 --port 8000
    networks:
      - mc-network
    depends_on:
      mc-match-creation:
        condition: service_healthy
      mc-match:
        condition: service_started
      mc-deck:
        condition: service_started
      mc-deck-service:
        condition: service_healthy
      mc-static:
        condition: service_healthy
      mc-users:
        condition: service_healthy
      mc-user-service:
        condition: service_healthy

  mc-match:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8100:8100"
    environment:
      - NODE_ENV=development
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/front/mc-match:/app/packages/front/mc-match
      # - ./packages/front/mc-frontend:/app/packages/front/mc-frontend
      # - ./packages/front/mc-components:/app/packages/front/mc-components
      # - ./node_modules:/app/node_modules
    command: npm run serve --workspace=packages/front/mc-match
    networks:
      - mc-network

  mc-deck:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8200:8200"
    environment:
      - NODE_ENV=development
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/front/mc-deck:/app/packages/front/mc-deck
      # - ./packages/front/mc-components:/app/packages/front/mc-components
      # - ./node_modules:/app/node_modules
    command: npm run serve --workspace=packages/front/mc-deck
    networks:
      - mc-network

  mc-static:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8300:8300"
    environment:
      - NODE_ENV=development
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/front/mc-static:/app/packages/front/mc-static
      # - ./node_modules:/app/node_modules
    command: npm run serve --workspace=packages/front/mc-static
    networks:
      - mc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:8300/remoteEntry.js').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  mc-users:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8400:8400"
    environment:
      - NODE_ENV=development
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/front/mc-users:/app/packages/front/mc-users
      # - ./packages/core/mc-endpoints:/app/packages/core/mc-endpoints
      # - ./node_modules:/app/node_modules
    command: npm run serve --workspace=packages/front/mc-users -- --host 0.0.0.0 --port 8400
    networks:
      - mc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:8400/remoteEntry.js').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  mc-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
      - AUTH_SERVICE_URL=https://mc-user-service:3003
      - FRONTEND_ORIGINS=https://51.20.138.135,https://localhost:8000,https://localhost:8100
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=mc
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/back/mc-back:/app/packages/back/mc-back
      # - ./packages/core/mc-endpoints:/app/packages/core/mc-endpoints
      # - ./packages/back/mc-data:/app/packages/back/mc-data
      # - ./packages/core/mc-shared:/app/packages/core/mc-shared
      # - ./node_modules:/app/node_modules
    command: npm run start:backend
    networks:
      - mc-network
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      mongodb:
        condition: service_healthy
      mc-user-service:
        condition: service_healthy

  mc-match-creation:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
      - MATCH_SERVICE_URL=https://mc-backend:3000
      - AUTH_SERVICE_URL=https://mc-user-service:3003
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=mc
      - FRONTEND_ORIGINS=https://51.20.138.135,https://localhost:8000,https://localhost:8100
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/back/mc-match-creation-service:/app/packages/back/mc-match-creation-service
      # - ./packages/core/mc-endpoints:/app/packages/core/mc-endpoints
      # - ./packages/back/mc-data:/app/packages/back/mc-data
      # - ./packages/core/mc-shared:/app/packages/core/mc-shared
      # - ./node_modules:/app/node_modules
    command: npm run start:match-creation
    networks:
      - mc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      mc-backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mc-user-service:
        condition: service_healthy

  mc-deck-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - TLS_CERT_PATH=/certs/localhost.pem
      - TLS_KEY_PATH=/certs/localhost-key.pem
      - NODE_EXTRA_CA_CERTS=/certs/rootCA.pem
      - AUTH_SERVICE_URL=https://mc-user-service:3003
      - FRONTEND_ORIGINS=https://51.20.138.135,https://localhost:8000,https://localhost:8100
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=mc
    volumes:
      - ./.local/certs:/certs:ro
      # - ./packages/back/mc-deck-service:/app/packages/back/mc-deck-service
      # - ./packages/back/mc-data:/app/packages/back/mc-data
      # - ./packages/core/mc-endpoints:/app/packages/core/mc-endpoints
      # - ./packages/core/mc-shared:/app/packages/core/mc-shared
      # - ./node_modules:/app/node_modules
    command: npm run start:mc-deck-service
    networks:
      - mc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:3002/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      mc-backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mc-user-service:
        condition: service_healthy

networks:
  mc-network:
    driver: bridge

volumes:
  mc-mongodb-data:
